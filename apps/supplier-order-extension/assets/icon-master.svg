<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">HB 供应商订货助手</title>
  <desc id="desc">橙色圆角方块中的白色 HB 字标，以及向下进入订货箱的深蓝箭头。</desc>

  <rect x="28" y="28" width="456" height="456" rx="88" fill="#EB5428"/>

  <!-- H 使用纯几何路径，避免构建机字体差异。 -->
  <path fill="#FFF9F2" d="M92 98h54v78h54V98h54v214h-54v-84h-54v84H92z"/>

  <!-- B 的两个内孔使用 evenodd 镂空，缩小后仍保持清晰。 -->
  <path fill="#FFF9F2" fill-rule="evenodd" d="
    M266 98h72c51 0 82 25 82 65 0 25-13 45-36 56 29 10 46 31 46 61 0 44-34 70-89 70h-75V98zm54 43v57h18c21 0 32-10 32-29 0-18-11-28-32-28h-18zm0 98v68h22c25 0 38-12 38-34 0-23-13-34-38-34h-22z
  "/>

  <!-- 开口箱保持为一个粗轮廓，16px 时仍能读作订货/入库。 -->
  <path fill="#FFF9F2" d="
    M139 344h55v29h-25l-10 19h194l-10-19h-25v-29h55l29 61c4 9 3 18-2 26-5 8-13 13-23 13H135c-10 0-18-5-23-13-5-8-6-17-2-26l29-61z
  "/>

  <path fill="#10263A" d="M234 294h44v64h34l-56 55-56-55h34z"/>
</svg>
