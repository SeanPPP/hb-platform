plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.hbappinstaller'
version = '0.1.0'

android {
  namespace "expo.modules.hbappinstaller"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
}

dependencies {
  implementation 'androidx.core:core:1.17.0'
  testImplementation 'junit:junit:4.13.2'
}
