# Independent static vhost for ANTPOS. It does not proxy to an application port.
map $uri $antpos_cache_control {
    default "no-cache";
    "/" "public, no-cache, no-transform";
    "/index.html" "public, no-cache, no-transform";
    ~^/assets/ "public, max-age=86400";
    ~^/(favicon\.svg|robots\.txt|sitemap\.xml)$ "public, max-age=3600";
}

server {
    listen 80;
    listen [::]:80;
    server_name antpos.dev www.antpos.dev;

    root /www/wwwroot/antpos.dev;

    access_log /www/wwwlogs/antpos.dev.log;
    error_log /www/wwwlogs/antpos.dev.error.log;

    location ^~ /.well-known/acme-challenge/ {
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://antpos.dev$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.antpos.dev;

    ssl_certificate /etc/letsencrypt/live/antpos.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/antpos.dev/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:ANTPOS_SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header X-Frame-Options "DENY" always;

    return 301 https://antpos.dev$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name antpos.dev;

    root /www/wwwroot/antpos.dev;
    index index.html;
    charset utf-8;

    access_log /www/wwwlogs/antpos.dev.log;
    error_log /www/wwwlogs/antpos.dev.error.log;

    ssl_certificate /etc/letsencrypt/live/antpos.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/antpos.dev/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:ANTPOS_SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Cache-Control $antpos_cache_control always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; connect-src 'none'; font-src 'self'; form-action 'none'; frame-ancestors 'none'; frame-src 'none'; img-src 'self' data:; media-src 'none'; object-src 'none'; script-src 'self' 'sha256-aCmhZsuRVis/+WgNplqsc2JgVjHk+UQePT3Lt/x4EPM='; script-src-attr 'none'; style-src 'self'; worker-src 'none'; upgrade-insecure-requests" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header X-Frame-Options "DENY" always;

    location ^~ /.well-known/acme-challenge/ {
        default_type text/plain;
        try_files $uri =404;
    }

    location = / {
        try_files /index.html =404;
    }

    location = /index.html {
        try_files $uri =404;
    }

    location ^~ /assets/ {
        try_files $uri =404;
        access_log off;
    }

    location ~* ^/(favicon\.svg|robots\.txt|sitemap\.xml)$ {
        try_files $uri =404;
        access_log off;
    }

    location ~ /\. {
        deny all;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
