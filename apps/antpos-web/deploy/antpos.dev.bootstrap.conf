# Temporary HTTP-only vhost used for the first ACME HTTP-01 challenge.
server {
    listen 80;
    listen [::]:80;
    server_name antpos.dev www.antpos.dev;

    root /www/wwwroot/antpos.dev;
    index index.html;

    access_log /www/wwwlogs/antpos.dev.log;
    error_log /www/wwwlogs/antpos.dev.error.log;

    location ^~ /.well-known/acme-challenge/ {
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://antpos.dev$request_uri;
    }
}
